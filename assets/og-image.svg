<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Imagen para compartir. Sustitúyela por el cartel oficial cuando exista (ver README). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="110%">
      <stop offset="0" stop-color="#5a1020"/>
      <stop offset=".55" stop-color="#3b0a14"/>
      <stop offset="1" stop-color="#2a0710"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0" stop-color="#d6a446" stop-opacity=".28"/>
      <stop offset="1" stop-color="#d6a446" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curtain" x1="0" x2="1">
      <stop offset="0" stop-color="#8e1b2c"/>
      <stop offset=".25" stop-color="#5a1020"/>
      <stop offset=".5" stop-color="#8e1b2c"/>
      <stop offset=".75" stop-color="#5a1020"/>
      <stop offset="1" stop-color="#3b0a14"/>
    </linearGradient>
    <path id="star" d="M0 -10 L2.4 -2.4 L10 0 L2.4 2.4 L0 10 L-2.4 2.4 L-10 0 L-2.4 -2.4z"/>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Telones -->
  <path d="M0 0h150v630c-40-60-110-90-150-100z" fill="url(#curtain)"/>
  <path d="M1200 0h-150v630c40-60 110-90 150-100z" fill="url(#curtain)"/>
  <rect x="40" y="380" width="96" height="10" rx="5" fill="#d6a446" transform="rotate(-12 88 385)"/>
  <rect x="1064" y="380" width="96" height="10" rx="5" fill="#d6a446" transform="rotate(12 1112 385)"/>

  <!-- Guirnalda -->
  <path d="M150 22 Q375 80 600 30 T1050 22" fill="none" stroke="#fbf6ec" stroke-opacity=".3" stroke-width="2"/>
  <g>
    <ellipse cx="220" cy="46" rx="6" ry="9" fill="#ecc97a"/>
    <ellipse cx="310" cy="58" rx="6" ry="9" fill="#f0786f"/>
    <ellipse cx="400" cy="56" rx="6" ry="9" fill="#9fd4a8"/>
    <ellipse cx="490" cy="46" rx="6" ry="9" fill="#ecc97a"/>
    <ellipse cx="710" cy="42" rx="6" ry="9" fill="#f0786f"/>
    <ellipse cx="800" cy="54" rx="6" ry="9" fill="#9fd4a8"/>
    <ellipse cx="890" cy="54" rx="6" ry="9" fill="#ecc97a"/>
    <ellipse cx="980" cy="40" rx="6" ry="9" fill="#f0786f"/>
  </g>

  <!-- Estrellas -->
  <g fill="#ecc97a" opacity=".7">
    <use href="#star" x="230" y="160"/>
    <use href="#star" x="980" y="150" transform="scale(1)"/>
    <use href="#star" x="260" y="470"/>
    <use href="#star" x="950" y="460"/>
    <use href="#star" x="600" y="96"/>
  </g>

  <!-- Texto -->
  <text x="600" y="132" text-anchor="middle" font-family="Figtree, Helvetica, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="4" fill="#ecc97a">6º DE PRIMARIA · CEIP REYES CATÓLICOS · CÁDIZ</text>
  <text x="600" y="250" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="104" fill="#fbf6ec" letter-spacing="-1">TODO ES POSIBLE</text>
  <text x="600" y="352" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="800" font-size="116" fill="#ecc97a">en Navidad</text>

  <!-- Cinta -->
  <path d="M330 398h540l-20 34 20 34H330l20-34z" fill="#1f3b2d"/>
  <path d="M346 408h508l-14 24 14 24H346l14-24z" fill="none" stroke="#ecc97a" stroke-opacity=".55" stroke-dasharray="6 5"/>
  <text x="600" y="444" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="34" letter-spacing="4" fill="#fbf6ec">UNA NAVIDAD DIFERENTE</text>

  <text x="600" y="530" text-anchor="middle" font-family="Figtree, Helvetica, Arial, sans-serif" font-weight="700" font-size="26" fill="#fbf6ec">11, 12 y 13 de diciembre · Donativo 5 €</text>

  <!-- Escenario -->
  <rect y="584" width="1200" height="46" fill="#4a2414"/>
  <rect y="580" width="1200" height="4" fill="#d6a446"/>
</svg>
